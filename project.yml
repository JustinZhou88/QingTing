# Project definition for the iPhone app. Generate the Xcode project with: xcodegen generate
# Build the third-party libraries first: ./setup-deps.sh
name: QingTing
options:
  bundleIdPrefix: com.zhoujingxuan
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
targets:
  QingTingPhone:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/iOS
      - Sources/LiveActivity
      - Resources/iOS/Assets.xcassets
      - path: ThirdParty/DeepFilterNet/models/DeepFilterNet3_onnx.tar.gz
        buildPhase: resources
      - path: ThirdParty/DeepFilterNet/models/DeepFilterNet3_ll_onnx.tar.gz
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: QingTing
        PRODUCT_BUNDLE_IDENTIFIER: com.zhoujingxuan.qingting
        INFOPLIST_FILE: Resources/iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shared/Bridging.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/ThirdParty/rnnoise/include
        # Both libraries are built for arm64 devices only. Link by full path so the linker does not pick libdf.dylib from the same folder
        OTHER_LDFLAGS:
          - $(PROJECT_DIR)/ThirdParty/rnnoise/build-ios/librnnoise.a
          - $(PROJECT_DIR)/ThirdParty/DeepFilterNet/target/aarch64-apple-ios/release/libdf.a
          - -framework
          - Security
          - -framework
          - SystemConfiguration
        # The simulator is only for looking at the UI: the denoise libraries are replaced by stubs (ThirdParty/sim-stubs) and the microphone is not opened
        "OTHER_LDFLAGS[sdk=iphonesimulator*]":
          - $(PROJECT_DIR)/ThirdParty/sim-stubs/libqtstubs.a
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # The developer team ID comes from the environment: put QINGTING_TEAM_ID=<your team ID> in local.env (not in the repository)
        DEVELOPMENT_TEAM: ${QINGTING_TEAM_ID}
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: QingTingWidgets
  # Dynamic Island / Lock Screen Live Activity
  QingTingWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Widget
      - Sources/LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhoujingxuan.qingting.widgets
        INFOPLIST_FILE: Resources/iOS/Widget-Info.plist
        SWIFT_VERSION: "5"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${QINGTING_TEAM_ID}
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SKIP_INSTALL: YES
